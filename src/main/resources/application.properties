spring.application.name=katalog
server.port=8080
server.address=0.0.0.0

spring.servlet.multipart.enabled=true
server.tomcat.max-part-count=100
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

spring.web.resources.static-locations=classpath:/static/,file:uploads/
upload.path=uploads

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/katalogb?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8&serverTimezone=Europe/Istanbul}
spring.datasource.username=${DB_USERNAME:deniz}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# Bildirimlerin gideceği adresler. Virgülle birden fazla adres yazılabilir;
# EmailService bunları ayırıp her birine ayrı ayrı gönderir.
app.company.email=denizcelikhalat363@gmail.com,karamandeniz363@gmail.com
# Sipariş bildirimleri de aynı listeye gitsin (tek kaynak -> iki property asla ayrışmaz).
app.order.notify-email=${app.company.email}